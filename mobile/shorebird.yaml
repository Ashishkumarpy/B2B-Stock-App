# Shorebird configuration (code push / OTA Dart patches).
# Docs: https://docs.shorebird.dev
#
# IMPORTANT: the `app_id` below is a PLACEHOLDER. It must be replaced with the
# real id generated by your Shorebird account. Run this once from the `mobile`
# directory after installing the CLI and logging in:
#
#     shorebird init
#
# `shorebird init` creates the app on Shorebird's backend and rewrites this
# file with the real app_id (and ensures shorebird.yaml is in pubspec assets,
# which we have already done). If you already created the app on the Shorebird
# console, just paste its app_id here instead.
app_id: REPLACE_WITH_shorebird_init

# Optional: pin patches to specific release channels. Leave commented unless
# you need staging vs production separation.
# channel: stable

# When true, the app checks for and downloads available patches automatically
# on launch (applied on the next restart). This is the default behavior.
auto_update: true
